  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1c1c1e;
      color: #fff;
      overscroll-behavior: none;
    }
    body.dark-mode { background: #1c1c1e; color: #fff; }
    body:not(.dark-mode) { background: #fff; color: #000; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; font-size: inherit; }
    .safe-top { padding-top: max(12px, env(safe-area-inset-top, 0px)); }
    .safe-bottom { padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .toast {
      position: fixed;
      top: max(20px, env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
      animation: fadeIn 0.25s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      max-width: 90%;
      text-align: center;
    }
    .fab {
      position: fixed;
      right: 20px;
      bottom: calc(80px + env(safe-area-inset-bottom, 0px));
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #0066cc;
      color: white;
      border: none;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,102,204,0.4);
      z-index: 30;
    }
    .fab:active { transform: scale(0.95); }
  </style>
</head>

  <div id="root"></div>
